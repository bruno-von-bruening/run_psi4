[project]
name = "run_psi4"
version = "0.1.02"
description = ''
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Scripts that will be system wide available after activation of conda environment, which the pip package is installed
# within
# [project.scripts]
# "my_run_psi4.py" = "bin_run_psi4:my_run_psi4.main"
[tool.setuptools]
script-files = ["bin/run_psi4_exe.py"]

package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
