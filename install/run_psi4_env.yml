name: run_psi4
channels:
  - conda-forge
  - conda-forge/label/libint_dev
  - defaults
dependencies:
  - python=3.11
  - numpy
  - psi4=1.11
  - dftd3-python
  - pip
  - pip:
    - build
    - pytest
    - rdkit
    - rich
    - setuptools-scm
    - basis_set_exchange
    - .. # installs top-level directory
    - git+ssh://git@github.com/bruno-von-bruening/qcp_global_utils.git@68f3857ae
    - git+ssh://git@github.com/bruno-von-bruening/qcp_objects.git@6e0294ed5
